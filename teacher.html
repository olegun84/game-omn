<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍🏫 Dashboard Guru - Math Shooter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        .solution-box {
            background: rgba(0, 245, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .solution-title {
            font-size: 0.85rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .solution-steps {
            list-style: none;
            counter-reset: step;
        }
        
        .solution-steps li {
            counter-increment: step;
            padding: 8px 0 8px 35px;
            position: relative;
            font-size: 0.9rem;
            color: #ddd;
            line-height: 1.5;
        }
        
        .solution-steps li::before {
            content: counter(step);
            position: absolute;
            left: 0;
            top: 8px;
            width: 24px;
            height: 24px;
            background: var(--neon-blue);
            color: var(--dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }
        
        .quick-tip {
            margin-top: 12px;
            padding: 10px 15px;
            background: rgba(255, 214, 0, 0.1);
            border-left: 3px solid var(--warning);
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: var(--warning);
        }
        
        .quick-tip::before {
            content: '💡 ';
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="stars"></div>

    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
        <div style="max-width: 400px; width: 100%; text-align: center;">
            <div style="font-size: 60px; margin-bottom: 20px;">👨‍🏫</div>
            <h2 style="font-size: 1.8rem; margin-bottom: 20px; color: var(--neon-blue);">Dashboard Guru</h2>
            <p style="color: #aaa; margin-bottom: 20px;">Pantau permainan siswa dan lihat cara menyelesaikan soal</p>
            
            <div class="input-group">
                <label>🔑 Password Guru</label>
                <input type="password" id="teacherPassword" placeholder="Masukkan password...">
            </div>
            
            <button class="btn btn-primary" id="loginBtn">🔓 MASUK</button>
            
            <br><br>
            <a href="index.html" style="color: #aaa; text-decoration: none;">← Kembali ke Game</a>
            
            <p style="margin-top: 20px; font-size: 0.8rem; color: #666;">
                Default password: <strong>guru2026</strong>
            </p>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardScreen" class="screen">
        <div class="teacher-header">
            <div>
                <h1 class="teacher-title">👨‍🏫 Dashboard Guru</h1>
                <div class="auto-refresh-indicator">
                    <div class="pulse-dot"></div>
                    <span>Auto-refresh aktif (5 detik)</span>
                </div>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
                <button class="refresh-btn" id="logoutBtn" style="border-color: var(--danger); color: var(--danger);">🚪 Logout</button>
                <a href="index.html" class="refresh-btn">🎮 Game</a>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-card-value" id="totalActive">0</div>
                <div class="stat-card-label">Siswa Aktif</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="totalScore">0</div>
                <div class="stat-card-label">Total Skor</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="avgScore">0</div>
                <div class="stat-card-label">Rata-rata Skor</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="highestScore">0</div>
                <div class="stat-card-label">Skor Tertinggi</div>
            </div>
        </div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-grade="all">Semua</button>
            <button class="filter-btn" data-grade="1">Kelas 1</button>
            <button class="filter-btn" data-grade="2">Kelas 2</button>
            <button class="filter-btn" data-grade="3">Kelas 3</button>
            <button class="filter-btn" data-grade="4">Kelas 4</button>
            <button class="filter-btn" data-grade="5">Kelas 5</button>
            <button class="filter-btn" data-grade="6">Kelas 6</button>
            <button class="filter-btn" data-grade="7">Kelas 7</button>
            <button class="filter-btn" data-grade="8">Kelas 8</button>
            <button class="filter-btn" data-grade="9">Kelas 9</button>
        </div>
        
        <div class="active-games-grid" id="activeGamesGrid">
            <div class="no-games">
                <div class="no-games-emoji">📡</div>
                <p>Memuat data...</p>
            </div>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script src="teacher.js"></script>
</body>
</html>
