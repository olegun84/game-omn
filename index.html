<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Shooter - OMN 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==================== START SCREEN ==================== -->
  <div id="startScreen">
    <div class="start-container">
      <div class="zombie-icon">🧟</div>
      <h1 class="game-title">MATH <span class="title-shoot">SHOOTER</span></h1>
      <p class="subtitle">Tembak Zombie & Helikopter dengan Matematika! 🎯</p>
      <p class="subtitle-small">OMN 2026 Edition - Soal Tak Terbatas</p>

      <div class="form-group">
        <label> Nama Pemain</label>
        <input type="text" id="playerName" placeholder="Masukkan nama..." value="opik">
      </div>

      <div class="form-group">
        <label>📚 Pilih Kategori</label>
        <select id="categorySelect">
          <option value="SEMUA KELAS">🎲 SEMUA KELAS (Campuran)</option>
          <option value="KELAS 1">Kelas 1</option>
          <option value="KELAS 2">Kelas 2</option>
          <option value="KELAS 3">Kelas 3</option>
        </select>
      </div>

      <button id="startBtn" class="btn-start">🚀 MULAI BERMAIN</button>
      <button id="leaderboardBtn" class="btn-leaderboard">🏆 LEADERBOARD</button>
      <button id="teacherModeBtn" class="btn-teacher">👨‍🏫 Mode Guru</button>
    </div>
  </div>

  <!-- ==================== GAME SCREEN ==================== -->
  <div id="gameScreen" style="display: none;">
    <!-- HUD -->
    <div class="hud">
      <div class="hud-item"> Skor: <strong id="scoreDisplay">0</strong></div>
      <div class="hud-item">🔥 Combo: <strong id="comboDisplay">0x</strong></div>
      <div class="hud-item">🌊 Wave: <strong id="waveDisplay">1</strong></div>
      <div class="hud-item">💀 Kalah: <strong id="defeatDisplay">0</strong></div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <!-- Question Number -->
    <div id="questionNum" class="question-num">SOAL 1 / 15</div>

    <!-- Canvas -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Question Box -->
    <div id="questionBox" class="question-box">
      <span id="topicLabel" class="topic-label">NILAI TEMPAT</span>
      <p id="questionText">Loading...</p>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <div class="overlay-content">
        <h2 id="endTitle">💀 GAME OVER</h2>
        <p class="final-score-text">Skor Akhir: <strong id="finalScore">0</strong></p>
        <div class="overlay-buttons">
          <button id="restartBtn" class="btn-restart">🔄 MAIN LAGI</button>
          <button id="backToMenuBtn" class="btn-menu">🏠 KEMBALI KE MENU</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
